# Start:   docker compose up -d --build
# Logs:    docker compose logs -f writer
# Web UI:  docker compose --profile web up -d   (needs CLIENT=<id> in .env), then open http://127.0.0.1:8000
services:
  # 1. Background daemon: runs daily autonomous scheduling, research & automatic publishing
  writer:
    build: .
    image: ${CLIENT:-bhandari}-autoblog
    container_name: ${CLIENT:-bhandari}-autoblog-scheduler
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      SCHEDULE_TIME: ${SCHEDULE_TIME:-09:07}
      SCHEDULE_TZ: ${SCHEDULE_TZ:-Asia/Kolkata}
      TZ: ${SCHEDULE_TZ:-Asia/Kolkata}   # clock for logs and timestamps
    volumes:
      - seo-data:/app/data
      - ./clients:/app/clients:ro   # edit config.yaml, then: docker compose restart writer
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # 2. Web UI dashboard: live calendar, article previews, manual triggers & settings on port 8000
  web:
    image: ${CLIENT:-bhandari}-autoblog
    container_name: ${CLIENT:-bhandari}-autoblog-dashboard
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      TZ: ${SCHEDULE_TZ:-Asia/Kolkata}   # clock for logs, job page and draft names
    command: ["sh", "-c", "exec python cli.py serve \"$${CLIENT:-bhandari}\" --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - seo-data:/app/data
      - ./clients:/app/clients:ro
    depends_on: [writer]

volumes:
  seo-data:
