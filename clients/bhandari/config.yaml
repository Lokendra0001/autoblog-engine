context: |
  Bhandari TechFab LLP manufactures Glass Fibre Reinforced Polymer (GFRP) reinforcement in Surat,
  Gujarat, with branch offices in Pune and Bengaluru. GFRP rebar is a composite of high-strength
  glass fibres in a polymer resin matrix, used as a corrosion-free alternative to TMT/steel
  reinforcement in concrete.

  Products:
  - GFRP rebars, 3 mm to 32 mm diameter
  - GFRP mesh (flatwork, precast, tunnels)
  - GFRP bent bars and stirrups
  - Custom-fabricated GFRP reinforcement

  Standards: rebars are manufactured to IS 18256:2023, each lot is batch-tested to IS 18255:2023,
  and the products comply with IRC:137. Internationally, ASTM D7957 and ACI 440 are the
  reference standards for GFRP bars.

  Key properties (state qualitatively unless a figure appears in the research data):
  - Does not corrode in chloride, marine or chemical environments
  - About 75% lighter than steel (roughly one-quarter the weight)
  - High tensile strength, typically higher than Fe500 steel; lower elastic modulus than steel,
    so designs are usually governed by serviceability (deflection and crack width)
  - Non-magnetic and electrically non-conductive
  - Long service life with low maintenance; lower lifecycle cost in aggressive environments

  Applications: bridges and flyovers, RCC roads and highways, marine and coastal structures
  (jetties, sea walls, ports), tunnels, water tanks and treatment plants, swimming pools,
  MRI rooms and toll plazas, precast elements, chemical and industrial plants, airports.

writing_notes: |
  - Never quote prices: say they depend on diameter, quantity and site location, and point to a quotation.
  - Mention genuine design considerations where relevant: lower elastic modulus than steel, bends must be
    made at the factory, behaviour under fire exposure.
  - Ground articles in Indian conditions: IS/IRC codes, coastal and monsoon exposure, Indian infrastructure.
  - Cite research findings as "a 2024 bond-behaviour study found...", never by invented figures.

